services:
  - type: web
    name: threatlens-api
    runtime: python
    plan: starter
    pythonVersion: "3.12.8"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:////var/data/threatlens.db
      - key: PYTHON_VERSION
        value: "3.12.8"
    disk:
      name: threatlens-data
      mountPath: /var/data
      sizeGB: 1
